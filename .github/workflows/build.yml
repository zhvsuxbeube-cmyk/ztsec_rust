name: build

on:
  push:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    env:
      RUSTFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-msvc
      - name: Test
        run: cargo test
      - name: Build
        run: cargo build --release --target x86_64-pc-windows-msvc
      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Plugin
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          # cl /nologo /LD /EHs-c- /GR- /GS- /Zl /std:c++17 hello.cpp /link /NOENTRY /NODEFAULTLIB /OUT:hello.dll kernel32.lib user32.lib
          cl /nologo /LD /EHs-c- /GR- /GS- /Zl /std:c++17 plugin\hello.cpp /link /NOENTRY /NODEFAULTLIB /OUT:dist\hello.dll kernel32.lib user32.lib
          if ($LASTEXITCODE -ne 0) { throw 'plugin build failed' }
          dumpbin /exports dist\hello.dll | Out-File dist\exports.txt
          $exports = Get-Content dist\exports.txt -Raw
          foreach ($name in 'PluginOnLoad','PluginOnEvent','PluginOnUnload') {
            if ($exports -notmatch $name) { throw "missing export: $name" }
          }
      - name: Spy
        shell: pwsh
        run: |
          $exe = Join-Path $PWD 'target\x86_64-pc-windows-msvc\release\ztsec_agent.exe'
          $panel = Start-Process python -ArgumentList 'tools\panel.py','--port','4794','--test',"$PWD\dist\hello.dll" -NoNewWindow -PassThru -RedirectStandardOutput 'panel.out' -RedirectStandardError 'panel.err'
          Start-Sleep -Seconds 2
          $env:ZTSEC_CI = '1'
          $agent = Start-Process $exe -ArgumentList '--ip','127.0.0.1','--port','4794' -NoNewWindow -PassThru -RedirectStandardOutput 'agent.out' -RedirectStandardError 'agent.err'
          if (-not $panel.WaitForExit(30000)) { Stop-Process $panel.Id -Force; Stop-Process $agent.Id -Force; throw 'panel timeout' }
          if ($agent.HasExited -eq $false) { Stop-Process $agent.Id -Force }
          $p = Get-Content panel.out -Raw
          if ($p -notmatch 'ACK:PLUGIN:hello') { throw 'plugin ack' }
          if ($p -notmatch 'ACK:PLUGIN_EVENT:ping') { throw 'event ack' }
          if ($p -notmatch 'ACK:PLUGIN_OUT:hello') { throw 'unload ack' }
          if ($p -notmatch 'ACK:CLOSE') { throw 'close ack' }
          Write-Host '--- panel ---'
          Get-Content panel.out
          Write-Host '--- panel err ---'
          Get-Content panel.err
          Write-Host '--- agent ---'
          Get-Content agent.out
          Get-Content agent.err
          $a = Get-Content agent.out -Raw
          if ($a -notmatch 'plugin event: event ping') { throw 'plugin callback' }
      - name: Execute
        shell: pwsh
        run: |
          $exe = Join-Path $PWD 'target\x86_64-pc-windows-msvc\release\ztsec_agent.exe'
          Set-Content -Path 'dist\test_exec.ps1' -Value "Write-Output 'ztsec_execute_ok'" -Encoding UTF8
          $panel = Start-Process python -ArgumentList 'tools\exec_test.py','4795',"$PWD\dist\test_exec.ps1" -NoNewWindow -PassThru -RedirectStandardOutput 'exec_panel.out' -RedirectStandardError 'exec_panel.err'
          Start-Sleep -Seconds 2
          $env:ZTSEC_CI = '1'
          $agent = Start-Process $exe -ArgumentList '--ip','127.0.0.1','--port','4795' -NoNewWindow -PassThru -RedirectStandardOutput 'exec_agent.out' -RedirectStandardError 'exec_agent.err'
          if (-not $panel.WaitForExit(30000)) { Stop-Process $panel.Id -Force; Stop-Process $agent.Id -Force; throw 'execute panel timeout' }
          if ($agent.HasExited -eq $false) { Stop-Process $agent.Id -Force }
          if ($panel.ExitCode -ne 0) {
            Get-Content exec_panel.out; Get-Content exec_panel.err
            Get-Content exec_agent.out; Get-Content exec_agent.err
            throw 'execute test failed'
          }
          Write-Host '--- execute panel ---'
          Get-Content exec_panel.out
      - name: Minimal Python update handoff
        shell: pwsh
        run: |
          python tools\python_update_handoff\testpanel.py --timeout 60
          if ($LASTEXITCODE -ne 0) { throw 'minimal Python update handoff failed' }
      - name: Update handoff
        shell: pwsh
        run: |
          $exe = Join-Path $PWD 'target\x86_64-pc-windows-msvc\release\ztsec_agent.exe'
          python tools\update_test.py --agent $exe
          if ($LASTEXITCODE -ne 0) { throw 'update handoff test failed' }
      - name: Update panel handoff
        shell: pwsh
        run: |
          $exe = Join-Path $PWD 'target\x86_64-pc-windows-msvc\release\ztsec_agent.exe'
          python tools\update_panel_test.py --agent $exe
          if ($LASTEXITCODE -ne 0) { throw 'update panel handoff test failed' }
      - name: Archive
        shell: pwsh
        run: |
          Copy-Item target\x86_64-pc-windows-msvc\release\ztsec_agent.exe dist\ztsec_agent.exe
          Compress-Archive -Path dist\ztsec_agent.exe,dist\hello.dll,dist\exports.txt -DestinationPath ztsec_agent-win64.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: ztsec_agent-win64
          path: ztsec_agent-win64.zip

name: build

on:
  push:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    env:
      RUSTFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-msvc
      - name: Test
        run: cargo test
      - name: Build
        run: cargo build --release --target x86_64-pc-windows-msvc
      - name: Spy
        shell: pwsh
        run: |
          $exe = Join-Path $PWD 'target\x86_64-pc-windows-msvc\release\ztsec_agent.exe'
          $listener = [System.Net.Sockets.TcpListener]::new([System.Net.IPAddress]::Loopback, 4794)
          $listener.Start()
          $first = Start-Process $exe -ArgumentList '--ip','127.0.0.1','--port','4794' -NoNewWindow -PassThru -RedirectStandardOutput 'agent.out' -RedirectStandardError 'agent.err'
          $client = $listener.AcceptTcpClient()
          $second = Start-Process $exe -ArgumentList '--ip','127.0.0.1','--port','4794' -NoNewWindow -PassThru
          if (-not $second.WaitForExit(3000)) { Stop-Process $second.Id -Force; throw 'mutex' }
          if ($second.ExitCode -ne 0) { throw "mutex exit $($second.ExitCode)" }
          $stream = $client.GetStream()
          $reader = [System.IO.StreamReader]::new($stream)
          $writer = [System.IO.StreamWriter]::new($stream)
          $writer.AutoFlush = $true
          $hello = $reader.ReadLine()
          $data = $reader.ReadLine()
          if (-not $hello.StartsWith('HELLO:FINGERPRINT:')) { throw 'handshake' }
          if ($data.Split('|').Count -ne 16) { throw 'telemetry' }
          $writer.WriteLine('CMD:CLOSE')
          if ($reader.ReadLine() -ne 'ACK:CLOSE') { throw 'ack' }
          if (-not $first.WaitForExit(5000)) { Stop-Process $first.Id -Force; throw 'exit' }
          $listener.Stop()
          Write-Host '--- stdout ---'
          Get-Content agent.out
          Write-Host '--- stderr ---'
          Get-Content agent.err
      - name: Archive
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target\x86_64-pc-windows-msvc\release\ztsec_agent.exe dist\ztsec_agent.exe
          Compress-Archive -Path dist\* -DestinationPath ztsec_agent-win64.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: ztsec_agent-win64
          path: ztsec_agent-win64.zip

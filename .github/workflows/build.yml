name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Initialize Linux build log
        shell: bash
        run: |
          : > linux_log.log
      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          rustup toolchain install 1.92.0 --profile minimal 2>&1 | tee -a linux_log.log
          rustup default 1.92.0 2>&1 | tee -a linux_log.log
      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.toml', 'protocol/Cargo.toml', 'server/Cargo.toml', 'tools/**/Cargo.toml', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Verify vendored Arti is unchanged
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --quiet -- vendor/arti; then
            echo "vendor/arti was modified during CI; Arti must remain unchanged" >&2
            git diff -- vendor/arti >&2 || true
            exit 1
          fi
      - name: Verify ZTSEC workspace excludes vendored Arti
        shell: bash
        run: python3 tools/verify_workspace.py
      - name: Cargo check preflight
        shell: bash
        run: |
          set -o pipefail
          cargo check --workspace 2>&1 | tee -a linux_log.log
      - name: Generate dependency lockfile
        shell: bash
        run: |
          set -o pipefail
          cargo generate-lockfile 2>&1 | tee -a linux_log.log
      - name: Test Rust workspace
        shell: bash
        run: |
          set -o pipefail
          cargo test --workspace 2>&1 | tee -a linux_log.log
      - name: Build Rust server and tooling
        shell: bash
        run: |
          set -o pipefail
          cargo build --release --package ztsec_server --bin ztsec-server 2>&1 | tee -a linux_log.log
          test -f target/release/ztsec-server
          test -x target/release/ztsec-server
          ls -lh target/release/ztsec-server | tee -a linux_log.log
          file target/release/ztsec-server | tee -a linux_log.log
          cargo build --manifest-path tools/auth-keygen/Cargo.toml 2>&1 | tee -a linux_log.log
          cargo build --manifest-path tools/load-test/Cargo.toml --release 2>&1 | tee -a linux_log.log
      - name: Python tests
        run: |
          python3 -m py_compile telemetry_service.py python_service.py tools/*.py
          python3 -m unittest tools.test_python_service
          python3 tools/test_update_contract.py
      - name: Local server/Python integration test
        shell: bash
        run: |
          set -o pipefail
          chmod +x tools/local_integration.sh 2>&1 | tee -a linux_log.log
          bash tools/local_integration.sh 2>&1 | tee -a linux_log.log
      - name: Initialize Docker build log
        shell: bash
        run: |
          : > docker_build.log
      - name: Docker build validation
        shell: bash
        run: |
          set -euo pipefail
          docker build -f docker/rust-server-builder.Dockerfile --target artifacts -t ztsec-rust-builder . 2>&1 | tee -a docker_build.log linux_log.log
          container_id=$(docker create ztsec-rust-builder /ztsec-server)
          trap 'docker rm -f "$container_id" >/dev/null 2>&1 || true; rm -f ztsec-server-docker' EXIT
          docker cp "$container_id:/ztsec-server" ./ztsec-server-docker 2>&1 | tee -a docker_build.log linux_log.log
          test -s ./ztsec-server-docker
          stat -c '%s bytes' ./ztsec-server-docker | tee -a docker_build.log linux_log.log
          file ./ztsec-server-docker | tee -a docker_build.log linux_log.log
          ls -lh ./ztsec-server-docker | tee -a docker_build.log linux_log.log
      - name: Upload Docker build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-docker-build-log
          path: docker_build.log
          if-no-files-found: error
      - name: Upload Linux cargo check log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-cargo-check-log
          path: linux_log.log
          if-no-files-found: error
      - name: Upload Linux server
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ztsec-server-linux-x64
          path: target/release/ztsec-server
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Initialize Windows build log
        shell: pwsh
        run: Set-Content -Path windows_log.log -Value ''
      - name: Install pinned Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install 1.92.0-x86_64-pc-windows-msvc --profile minimal 2>&1 | Tee-Object -FilePath windows_log.log -Append
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & rustup default 1.92.0-x86_64-pc-windows-msvc 2>&1 | Tee-Object -FilePath windows_log.log -Append
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~\.cargo\registry
            ~\.cargo\git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.toml', 'protocol/Cargo.toml', 'server/Cargo.toml', 'tools/**/Cargo.toml', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Verify vendored Arti is unchanged
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $diff = git diff -- vendor/arti
          if ($LASTEXITCODE -ne 0) { throw 'git diff failed' }
          if ($diff) {
            Write-Error 'vendor/arti was modified during CI; Arti must remain unchanged'
            $diff
            exit 1
          }
      - name: Verify ZTSEC workspace excludes vendored Arti
        shell: pwsh
        run: python tools/verify_workspace.py
      - name: Cargo check preflight
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & cargo check --package ztsec_agent 2>&1 | Tee-Object -FilePath windows_log.log -Append
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Generate dependency lockfile
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & cargo generate-lockfile 2>&1 | Tee-Object -FilePath windows_log.log -Append
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test agent
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & cargo test --package ztsec_agent --tests 2>&1 | Tee-Object -FilePath windows_log.log -Append
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Panel unit tests
        shell: pwsh
        run: python -m unittest tools.panel_test
      - name: Build agent
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & cargo build --release --target x86_64-pc-windows-msvc --bin ztsec_agent 2>&1 | Tee-Object -FilePath windows_log.log -Append
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $agentPath = Join-Path $PWD 'target\x86_64-pc-windows-msvc\release\ztsec_agent.exe'
          if (-not (Test-Path $agentPath -PathType Leaf)) { throw "agent binary was not produced: $agentPath" }
          $agentSize = (Get-Item $agentPath).Length
          if ($agentSize -le 0) { throw 'agent binary is empty' }
          Write-Host "agent binary: $agentPath ($agentSize bytes)"
          Add-Content -Path windows_log.log -Value "agent binary: $agentPath ($agentSize bytes)"
      - name: Plugin
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          cl /nologo /LD /EHs-c- /GR- /GS- /Zl /std:c++17 plugin\hello.cpp /link /NOENTRY /NODEFAULTLIB /OUT:dist\hello.dll kernel32.lib user32.lib
          if ($LASTEXITCODE -ne 0) { throw 'plugin build failed' }
          dumpbin /exports dist\hello.dll | Out-File dist\exports.txt
          $exports = Get-Content dist\exports.txt -Raw
          foreach ($name in 'PluginOnLoad','PluginOnEvent','PluginOnUnload') {
            if ($exports -notmatch $name) { throw "missing export: $name" }
          }
      - name: Spy
        shell: pwsh
        run: |
          $exe = Join-Path $PWD 'target\x86_64-pc-windows-msvc\release\ztsec_agent.exe'
          $panel = Start-Process python -ArgumentList 'tools\panel.py','--port','4794','--test',"$PWD\dist\hello.dll" -NoNewWindow -PassThru -RedirectStandardOutput 'panel.out' -RedirectStandardError 'panel.err'
          Start-Sleep -Seconds 2
          $env:ZTSEC_CI = '1'
          $agent = Start-Process $exe -ArgumentList '--ip','127.0.0.1','--port','4794' -NoNewWindow -PassThru -RedirectStandardOutput 'agent.out' -RedirectStandardError 'agent.err'
          if (-not $panel.WaitForExit(30000)) { Stop-Process $panel.Id -Force; Stop-Process $agent.Id -Force; throw 'panel timeout' }
          if ($agent.HasExited -eq $false) { Stop-Process $agent.Id -Force }
          $p = Get-Content panel.out -Raw
          if ($p -notmatch 'ACK:PLUGIN:hello') { throw 'plugin ack' }
          if ($p -notmatch 'ACK:PLUGIN_EVENT:ping') { throw 'event ack' }
          if ($p -notmatch 'ACK:PLUGIN_OUT:hello') { throw 'unload ack' }
          if ($p -notmatch 'ACK:CLOSE') { throw 'close ack' }
          Get-Content panel.out
          Get-Content panel.err
          Get-Content agent.out
          Get-Content agent.err
          $a = Get-Content agent.out -Raw
          if ($a -notmatch 'plugin event: event ping') { throw 'plugin callback' }
      - name: Execute
        shell: pwsh
        run: |
          $exe = Join-Path $PWD 'target\x86_64-pc-windows-msvc\release\ztsec_agent.exe'
          Set-Content -Path 'dist\test_exec.ps1' -Value "Write-Output 'ztsec_execute_ok'" -Encoding UTF8
          $panel = Start-Process python -ArgumentList 'tools\exec_test.py','4795',"$PWD\dist\test_exec.ps1" -NoNewWindow -PassThru -RedirectStandardOutput 'exec_panel.out' -RedirectStandardError 'exec_panel.err'
          Start-Sleep -Seconds 2
          $env:ZTSEC_CI = '1'
          $agent = Start-Process $exe -ArgumentList '--ip','127.0.0.1','--port','4795' -NoNewWindow -PassThru -RedirectStandardOutput 'exec_agent.out' -RedirectStandardError 'exec_agent.err'
          if (-not $panel.WaitForExit(30000)) { Stop-Process $panel.Id -Force; Stop-Process $agent.Id -Force; throw 'execute panel timeout' }
          if ($agent.HasExited -eq $false) { Stop-Process $agent.Id -Force }
          if ($panel.ExitCode -ne 0) {
            Get-Content exec_panel.out; Get-Content exec_panel.err
            Get-Content exec_agent.out; Get-Content exec_agent.err
            throw 'execute test failed'
          }
          Get-Content exec_panel.out
      - name: Update E2E
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Join-Path $PWD 'target\x86_64-pc-windows-msvc\release\ztsec_agent.exe'
          $work = Join-Path $PWD 'dist\update-e2e'
          New-Item -ItemType Directory -Force $work | Out-Null
          Copy-Item $exe (Join-Path $work 'ztsec_agent.exe') -Force
          $textPath = Join-Path $PWD 'src\text.rs'
          $original = Get-Content $textPath -Raw
          try {
            $updated = $original.Replace('pub const VERSION: &str = "Rust-Native/1";', 'pub const VERSION: &str = "Rust-Native/2";')
            if ($updated -eq $original) { throw 'failed to set update test version' }
            Set-Content -Path $textPath -Value $updated -NoNewline
            & cargo build --release --target x86_64-pc-windows-msvc 2>&1 | Tee-Object -FilePath windows_log.log -Append
            if ($LASTEXITCODE -ne 0) { throw "update build failed with exit code $LASTEXITCODE" }
            Copy-Item $exe (Join-Path $work 'ztsec_agent_updated.exe') -Force
          }
          finally {
            Set-Content -Path $textPath -Value $original -NoNewline
          }
          $panel = Start-Process python -ArgumentList 'tools\panel.py','--ip','127.0.0.1','--port','4796','--update-test',(Join-Path $work 'ztsec_agent_updated.exe'),'--expect-version','Rust-Native/2' -NoNewWindow -PassThru -RedirectStandardOutput (Join-Path $work 'panel.out') -RedirectStandardError (Join-Path $work 'panel.err')
          $deadline = (Get-Date).AddSeconds(15)
          while ((Get-Date) -lt $deadline) {
            if (Test-Path (Join-Path $work 'panel.out')) {
              $panelLog = Get-Content (Join-Path $work 'panel.out') -Raw
              if ($panelLog -match 'listening 127\.0\.0\.1:4796') { break }
            }
            Start-Sleep -Milliseconds 100
          }
          $env:ZTSEC_CI = '1'
          $agent = Start-Process (Join-Path $work 'ztsec_agent.exe') -ArgumentList '--ip','127.0.0.1','--port','4796' -NoNewWindow -PassThru -RedirectStandardOutput (Join-Path $work 'agent.out') -RedirectStandardError (Join-Path $work 'agent.err')
          if (-not $panel.WaitForExit(90000)) {
            if (-not $agent.HasExited) { Stop-Process $agent.Id -Force }
            Stop-Process $panel.Id -Force
            throw 'update e2e panel timeout'
          }
          if (-not $agent.HasExited) { Stop-Process $agent.Id -Force }
          if ($panel.ExitCode -ne 0) {
            Get-Content (Join-Path $work 'panel.out')
            Get-Content (Join-Path $work 'panel.err')
            Get-Content (Join-Path $work 'agent.out')
            Get-Content (Join-Path $work 'agent.err')
            throw "update e2e failed with exit code $($panel.ExitCode)"
          }
          $out = Get-Content (Join-Path $work 'panel.out') -Raw
          if ($out -notmatch 'ACK:UPDATE:') { throw 'missing update ack' }
          if ($out -notmatch 'Rust-Native/2') { throw 'updated agent did not reconnect with new version' }
          $finalBytes = [IO.File]::ReadAllBytes($exe)
          $expectedBytes = [IO.File]::ReadAllBytes((Join-Path $work 'ztsec_agent_updated.exe'))
          if (-not [Linq.Enumerable]::SequenceEqual($finalBytes, $expectedBytes)) { throw 'original executable path was not replaced with updated bytes' }
      - name: Archive
        shell: pwsh
        run: |
          Copy-Item dist\update-e2e\ztsec_agent.exe dist\ztsec_agent.exe -Force
          Compress-Archive -Path dist\ztsec_agent.exe,dist\hello.dll,dist\exports.txt,windows_log.log -DestinationPath ztsec_agent-win64.zip -Force
      - name: Upload Windows cargo check log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-cargo-check-log
          path: windows_log.log
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: ztsec-agent-win64
          path: ztsec_agent-win64.zip

  package:
    needs: [linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Package release bundle
        shell: bash
        run: |
          mkdir -p release
          cp dist/ztsec-server-linux-x64/ztsec-server release/ztsec-server
          cp dist/ztsec-agent-win64/ztsec_agent-win64.zip release/ztsec-agent-win64.zip
          cp telemetry_service.py release/telemetry_service.py
          cp README.md release/README.md
          tar -C release -czf ztsec-release.tgz .
      - uses: actions/upload-artifact@v4
        with:
          name: ztsec-release-bundle
          path: ztsec-release.tgz
